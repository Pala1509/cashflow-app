<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Zafra — Splash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
  :root{
    --bg:#131313; --card:#1D1D1F; --card-2:#242426; --line:#2C2C2F;
    --text-1:#F5F5F3; --text-2:#9A9A9E; --text-3:#5C5C60;
    --lime:#C6FF4D; --lime-dim:rgba(198,255,77,0.14); --lime-text:#1A2400;
    --coral:#FF7A6E; --lavender:#B9A6F5;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:#0c0c0d; color:var(--text-1); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; padding:44px 24px;}
  .stage{display:flex; flex-wrap:wrap; gap:34px; align-items:flex-start; justify-content:center;}
  .device-label{text-align:center; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-3); margin-bottom:12px;}

  .phone-frame{width:375px; height:812px; background:#000; border-radius:48px; padding:12px; box-shadow:0 0 0 1px #2a2a2c;}
  .phone-screen{background:var(--bg); width:100%; height:100%; border-radius:36px; overflow:hidden; position:relative; display:flex; flex-direction:column;}
  .notch{position:absolute; top:10px; left:50%; transform:translateX(-50%); width:100px; height:22px; background:#000; border-radius:14px; z-index:5;}

  /* SPLASH */
  .splash{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; overflow:hidden;}
  .glow{position:absolute; width:340px; height:340px; border-radius:50%; background:radial-gradient(circle, rgba(198,255,77,0.16), transparent 70%); top:50%; left:50%; transform:translate(-50%,-50%);}
  .mark{
    width:84px; height:84px; border-radius:24px; background:var(--lime); color:var(--lime-text);
    display:flex; align-items:center; justify-content:center; font-size:40px; font-weight:700;
    font-family:'Space Grotesk',sans-serif; position:relative; z-index:2;
    box-shadow:0 0 60px rgba(198,255,77,0.35);
  }
  .wordmark{margin-top:26px; font-size:32px; font-weight:700; font-family:'Space Grotesk',sans-serif; letter-spacing:0.01em; position:relative; z-index:2;}
  .tagline{margin-top:8px; font-size:13.5px; color:var(--text-2); position:relative; z-index:2;}
  .pulse-mini{margin-top:36px; width:180px; height:36px; position:relative; z-index:2;}

  /* HOME HEADER VERSION */
  .home-hdr{padding:26px 22px 6px;}
  .home-top{display:flex; align-items:center; gap:12px;}
  .home-mark{width:34px; height:34px; border-radius:10px; background:var(--lime); color:var(--lime-text); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; font-family:'Space Grotesk',sans-serif;}
  .home-name{font-size:17px; font-weight:700; font-family:'Space Grotesk',sans-serif;}
  .home-tag{font-size:11px; color:var(--text-3); margin-top:1px;}
  .home-bell{margin-left:auto; width:38px; height:38px; border-radius:50%; background:var(--card); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--text-2);}

  .body-preview{padding:22px; color:var(--text-3); font-size:12px; text-align:center; margin-top:30px;}
  .body-preview i{font-size:26px; display:block; margin-bottom:10px; color:var(--card-2);}
</style>
</head>
<body>

<div class="stage">

  <div>
    <div class="device-label">Zafra — Splash</div>
    <div class="phone-frame"><div class="phone-screen">
      <div class="notch"></div>
      <div class="splash">
        <div class="glow"></div>
        <div class="mark">Z</div>
        <div class="wordmark">Zafra</div>
        <div class="tagline">Tu control financiero.</div>
        <div class="pulse-mini">
          <svg viewBox="0 0 180 36" width="100%" height="100%" preserveAspectRatio="none">
            <polyline fill="none" stroke="#C6FF4D" stroke-width="2"
              points="0,26 15,20 30,28 45,14 60,22 75,8 90,18 105,4 120,16 135,10 150,20 165,6 180,14" />
          </svg>
        </div>
      </div>
    </div></div>
  </div>

  <div>
    <div class="device-label">Zafra — Header en la app</div>
    <div class="phone-frame"><div class="phone-screen">
      <div class="notch"></div>
      <div class="home-hdr">
        <div class="home-top">
          <div class="home-mark">Z</div>
          <div>
            <div class="home-name">Zafra</div>
            <div class="home-tag">Tu control financiero.</div>
          </div>
          <div class="home-bell"><i class="ti ti-bell"></i></div>
        </div>
      </div>
      <div class="body-preview">
        <i class="ti ti-layout-grid"></i>
        (aquí sigue el dashboard: balance, gráfico de onda, movimientos...)
      </div>
    </div></div>
  </div>

</div>

</body>
</html>
